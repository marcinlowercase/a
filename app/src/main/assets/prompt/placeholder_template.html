<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>outsync 4x8 placeholder matrix</title>
    <style>
        :root {
            /* unit scaling: 4 buttons + 5 gaps (0.4u) = 6u, 8 buttons + 9 gaps (0.4u) = 11.6u */
            --unit: min(calc(100vw / 6), calc(100dvh / 11.6));
            --gap: calc(var(--unit) * 0.4);

            /* circle radius equals half of button size */
            --radius: calc(var(--unit) / 2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* viewport */
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: white;
            font-family: system-ui, -apple-system, blinkmacsystemfont, "segoe ui", roboto, sans-serif;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 4x8 matrix canvas */
        .o-s-grid {
            width: calc(var(--unit) * 6);
            height: calc(var(--unit) * 11.6);
            padding: var(--gap);
            gap: var(--gap);

            display: grid;
            grid-template-columns: repeat(4, var(--unit));
            grid-template-rows: repeat(8, var(--unit));
            position: relative;
        }

        /* grid slot container */
        .o-s-grid-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            width: 100%;
            height: 100%;
        }

        /* coordinate mapping */
        [o-s-col="1"] { grid-column-start: 1; }
        [o-s-col="2"] { grid-column-start: 2; }
        [o-s-col="3"] { grid-column-start: 3; }
        [o-s-col="4"] { grid-column-start: 4; }

        [o-s-row="1"] { grid-row-start: 1; }
        [o-s-row="2"] { grid-row-start: 2; }
        [o-s-row="3"] { grid-row-start: 3; }
        [o-s-row="4"] { grid-row-start: 4; }
        [o-s-row="5"] { grid-row-start: 5; }
        [o-s-row="6"] { grid-row-start: 6; }
        [o-s-row="7"] { grid-row-start: 7; }
        [o-s-row="8"] { grid-row-start: 8; }

        [o-s-w="1"] { grid-column-end: span 1; }
        [o-s-w="2"] { grid-column-end: span 2; }
        [o-s-w="3"] { grid-column-end: span 3; }
        [o-s-w="4"] { grid-column-end: span 4; }

        [o-s-h="1"] { grid-row-end: span 1; }
        [o-s-h="2"] { grid-row-end: span 2; }
        [o-s-h="3"] { grid-row-end: span 3; }
        [o-s-h="4"] { grid-row-end: span 4; }

        /* button surfaces */
        .o-s-button {
            width: 100%;
            height: 100%;
            border-radius: var(--radius);
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            border: none;
            background: black;
            color: white;
            transition: transform 120ms ease, opacity 120ms ease;
            overflow: hidden;
        }

        .o-s-button:active {
            transform: scale(0.92);
            opacity: 0.8;
        }

        .label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.05em;
            opacity: 0.8;
        }

        .icon {
            font-size: 18px;
            line-height: 1;
        }
    </style>
</head>
<body>

<main class="o-s-grid" id="matrix-canvas">

<script>
    function haptic(type = 'click') {
        if (window.outsync?.haptic) window.outsync.haptic.vibrate(type);
    }

    function sound(type = 'beep') {
        if (window.outsync?.audio) window.outsync.audio.play(type);
    }

    function triggerTorch() {
        haptic('tick');
        if (window.outsync?.flashlight) {
            window.outsync.flashlight.toggle();
        }
    }
</script>
