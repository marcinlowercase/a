<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>outsync 4x8 placeholder matrix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* viewport */
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: whitesmoke;
            font-family: system-ui, -apple-system, blinkmacsystemfont, "segoe ui", roboto, sans-serif;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* fluid mobile canvas clamped only when squarer than 4:3 */
        .o-s-grid {
            width: 100vw;
            height: 100dvh;
            max-width: min(540px, calc(100dvh * 0.75));
            max-height: 100dvh;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(8, 1fr);
            padding: 0;
            gap: 0;
            position: relative;
            background-color: white;
        }

        /* grid slot container */
        .o-s-grid-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            width: 100%;
            height: 100%;
        }

        /* coordinate mapping */
        [o-s-col="1"] { grid-column-start: 1; }
        [o-s-col="2"] { grid-column-start: 2; }
        [o-s-col="3"] { grid-column-start: 3; }
        [o-s-col="4"] { grid-column-start: 4; }

        [o-s-row="1"] { grid-row-start: 1; }
        [o-s-row="2"] { grid-row-start: 2; }
        [o-s-row="3"] { grid-row-start: 3; }
        [o-s-row="4"] { grid-row-start: 4; }
        [o-s-row="5"] { grid-row-start: 5; }
        [o-s-row="6"] { grid-row-start: 6; }
        [o-s-row="7"] { grid-row-start: 7; }
        [o-s-row="8"] { grid-row-start: 8; }

        [o-s-w="1"] { grid-column-end: span 1; }
        [o-s-w="2"] { grid-column-end: span 2; }
        [o-s-w="3"] { grid-column-end: span 3; }
        [o-s-w="4"] { grid-column-end: span 4; }

        [o-s-h="1"] { grid-row-end: span 1; }
        [o-s-h="2"] { grid-row-end: span 2; }
        [o-s-h="3"] { grid-row-end: span 3; }
        [o-s-h="4"] { grid-row-end: span 4; }

        /* flush button tile surfaces with thick black internal borders */
        .o-s-button {
            width: 100%;
            height: 100%;
            border-radius: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            border-top: none;
            border-left: none;
            border-right: 2px solid black;
            border-bottom: 2px solid black;
            background: white;
            color: black;
            transition: opacity 120ms ease, background 120ms ease;
            overflow: hidden;
        }

        .o-s-button:active {
            opacity: 0.8;
            background: lightgray;
        }

        /* remove borders on right screen edge */
        [o-s-col="4"] > .o-s-button,
        [o-s-col="3"][o-s-w="2"] > .o-s-button,
        [o-s-col="2"][o-s-w="3"] > .o-s-button,
        [o-s-col="1"][o-s-w="4"] > .o-s-button,
        [o-s-w="4"] > .o-s-button {
            border-right: none;
        }

        /* remove borders on bottom screen edge */
        [o-s-row="8"] > .o-s-button,
        [o-s-row="7"][o-s-h="2"] > .o-s-button,
        [o-s-row="6"][o-s-h="3"] > .o-s-button,
        [o-s-row="5"][o-s-h="4"] > .o-s-button,
        [o-s-h="8"] > .o-s-button {
            border-bottom: none;
        }

        /* side borders when dark space is visible */
        @media (min-aspect-ratio: 3/4), (min-width: 540px) {
            .o-s-grid {
                border-left: 2px solid black;
                border-right: 2px solid black;
            }
        }

        .label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.05em;
            opacity: 0.85;
            pointer-events: none;
        }
    </style>
</head>
<body>

<main class="o-s-grid" id="matrix-canvas">

</main>

<script>
    function haptic(type = 'click') {
        if (window.outsync?.haptic) {
            window.outsync.haptic.vibrate(type);
        }
    }

    function sound(type = 'beep') {
        if (window.outsync?.audio) {
            window.outsync.audio.play(type);
        }
    }

    function triggerTorch() {
        haptic('tick');
        if (window.outsync?.flashlight) {
            window.outsync.flashlight.toggle();
        }
    }
</script>
</body>
</html>
