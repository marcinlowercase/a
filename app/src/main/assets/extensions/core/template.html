<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Outsync 4x8 Matrix</title>
    <style>
        :root {
            --device-corner-radius: 55px;
            --base-radius: 28px;
            --padding: 8px;
            --single-line-height: 100px;
            --max-list-height: 2;
            --animation-speed: 300ms;

            --highlight-color: #2563eb;
            --on-highlight: #ffffff;
            --off-highlight: #000000;

            --layer: 0;

            --bg-canvas: #ffffff;
            --card-surface: #f4f4f5;
            --card-border: #e4e4e7;
            --card-dark: #18181b;
            --card-dark-text: #fafafa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;

            --layer-corner-radius: max(
                0px,
                calc(
                    max(var(--device-corner-radius), calc(var(--base-radius) * min(1, var(--layer))))
                    - (var(--padding) * var(--layer))
                )
            );

            --layer-min-height: calc(
                var(--single-line-height) - (var(--padding) * var(--layer) * 2)
            );

            --layer-height: max(
                calc(var(--layer-corner-radius) * 2),
                var(--layer-min-height)
            );

            --layer-animation-speed: max(
                0ms,
                calc(var(--animation-speed) - (50ms * var(--layer)))
            );
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-canvas);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        .outsync-grid {
            --layer: 3;
            display: grid;
            width: 100%;
            height: 100%;
            padding: calc(var(--padding) * var(--layer));
            gap: calc(var(--padding) * var(--layer));
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-template-rows: repeat(8, minmax(0, 1fr));
        }

        .outsync-grid > * {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
        }

        [o-s-col="1"] { grid-column-start: 1; }
        [o-s-col="2"] { grid-column-start: 2; }
        [o-s-col="3"] { grid-column-start: 3; }
        [o-s-col="4"] { grid-column-start: 4; }

        [o-s-row="1"] { grid-row-start: 1; }
        [o-s-row="2"] { grid-row-start: 2; }
        [o-s-row="3"] { grid-row-start: 3; }
        [o-s-row="4"] { grid-row-start: 4; }
        [o-s-row="5"] { grid-row-start: 5; }
        [o-s-row="6"] { grid-row-start: 6; }
        [o-s-row="7"] { grid-row-start: 7; }
        [o-s-row="8"] { grid-row-start: 8; }

        [o-s-w="1"] { grid-column-end: span 1; }
        [o-s-w="2"] { grid-column-end: span 2; }
        [o-s-w="3"] { grid-column-end: span 3; }
        [o-s-w="4"] { grid-column-end: span 4; }

        [o-s-h="1"] { grid-row-end: span 1; }
        [o-s-h="2"] { grid-row-end: span 2; }
        [o-s-h="3"] { grid-row-end: span 3; }
        [o-s-h="4"] { grid-row-end: span 4; }

        .o-s-card {
            --layer: 3;
            width: 100%;
            height: 100%;
            border-radius: var(--layer-corner-radius);
            padding: var(--padding);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--card-border);
            background: var(--card-surface);
            color: #27272a;
            transition: transform 120ms ease, opacity 120ms ease;
        }

        .o-s-card:active {
            transform: scale(0.96);
            opacity: 0.85;
        }

        .o-s-card.primary {
            background: var(--highlight-color);
            color: var(--on-highlight);
            border: none;
        }

        .o-s-card.dark {
            background: var(--card-dark);
            color: var(--card-dark-text);
            border: none;
        }

        .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        .value {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.1;
        }

        .icon {
            font-size: 20px;
            line-height: 1;
        }
        .o-s-grid-container {
            background: red
        }
    </style>
</head>
<body>

<main class="outsync-grid">

    <!-- ROWS 1-2: 4x2 Main Banner -->
    <div class="o-s-grid-container" o-s-col="1" o-s-row="1" o-s-w="4" o-s-h="2">
        <div class="o-s-card dark" onclick="haptic('success')">
            <span class="label">System Overview</span>
            <span class="value" style="font-size: 26px; margin: 4px 0;">4×8 Home Screen</span>
            <span class="label" style="opacity: 0.5;">outsync.css • 32 addressable cells</span>
        </div>
    </div>

    <!-- ROWS 3-4: HYBRID BLOCK -->
    <div class="o-s-grid-container" o-s-col="1" o-s-row="3" o-s-w="2" o-s-h="2">
        <div class="o-s-card primary" onclick="incrementCounter()">
            <span class="label">Counter</span>
            <span class="value" id="counter-val" style="font-size: 32px; margin: 4px 0;">0</span>
            <span class="label" style="opacity: 0.8;">Tap to +1</span>
        </div>
    </div>

    <div class="o-s-grid-container" o-s-col="3" o-s-row="3" o-s-w="2" o-s-h="1">
        <div class="o-s-card">
            <span class="label">Status</span>
            <span class="value" style="font-size: 15px;">Live Matrix</span>
        </div>
    </div>

    <div class="o-s-grid-container" o-s-col="3" o-s-row="4" o-s-w="1" o-s-h="1">
        <div class="o-s-card" onclick="triggerTorch()">
            <span class="icon">🔦</span>
            <span class="label" style="font-size: 9px; margin-top: 2px;">Flash</span>
        </div>
    </div>

    <div class="o-s-grid-container" o-s-col="4" o-s-row="4" o-s-w="1" o-s-h="1">
        <div class="o-s-card" onclick="playAudio()">
            <span class="icon">🔔</span>
            <span class="label" style="font-size: 9px; margin-top: 2px;">Audio</span>
        </div>
    </div>

    <!-- ROWS 5-7: SYMMETRICAL 2x3 BLOCKS -->
    <div class="o-s-grid-container" o-s-col="1" o-s-row="5" o-s-w="2" o-s-h="3">
        <div class="o-s-card" style="justify-content: space-between; padding: calc(var(--padding) * 1.5);">
            <span class="label">Drive Sync (BYOS)</span>
            <div>
                <span class="value" id="sync-status" style="font-size: 14px;">Ready</span>
                <div class="label" style="margin-top: 4px;">Local Database</div>
            </div>
            <div class="label" style="font-size: 9px; opacity: 0.5;">Auto-Mirrored</div>
        </div>
    </div>

    <!-- Col 3-4: 2x3 Native CameraX Loopback Stream & ML Kit Scanner -->
    <div class="o-s-grid-container" o-s-col="3" o-s-row="5" o-s-w="2" o-s-h="3">
        <div class="o-s-card" style="padding: 0; overflow: hidden; position: relative;" onclick="toggleCamera()">
            <img id="cam-feed" alt="Camera Stream" style="width: 100%; height: 100%; object-fit: cover; border-radius: var(--layer-corner-radius); background: #000; display: none;">
            <div id="cam-overlay" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(24, 24, 27, 0.7); color: #fafafa;">
                <span class="icon">📷</span>
                <span id="cam-overlay-label" class="label" style="margin-top: 4px; color: #fff;">Tap to Start</span>
            </div>
        </div>
    </div>

    <!-- ROW 8: 4x1 Bottom Action Dock -->
    <div class="o-s-grid-container" o-s-col="1" o-s-row="8" o-s-w="4" o-s-h="1">
        <div class="o-s-card primary" onclick="haptic('celebration')">
            <span class="value" style="font-size: 16px;">Complete Execution Matrix</span>
        </div>
    </div>

</main>

<script>
    function haptic(type = 'click') {
        if (window.outsync?.haptic) window.outsync.haptic.vibrate(type);
    }

    function sound(type = 'beep') {
        if (window.outsync?.audio) window.outsync.audio.play(type);
    }

    let counter = 0;
    function incrementCounter() {
        counter++;
        document.getElementById('counter-val').innerText = counter;
        haptic('click');
    }

    function playAudio() {
        haptic('click');
        sound('beep');
    }

    function triggerTorch() {
        haptic('tick');
        if (window.outsync?.flashlight) {
            window.outsync.flashlight.toggle();
        }
    }

    // ==========================================
    // CAMERAX & LOOPBACK STREAM LIFECYCLE
    // ==========================================
    let isCameraActive = false;

    async function toggleCamera() {
        const img = document.getElementById('cam-feed');
        const overlay = document.getElementById('cam-overlay');
        const label = document.getElementById('cam-overlay-label');

        // Verify native bridge exists
        if (!window.outsync?.camera) {
            alert("Error: window.outsync.camera is undefined. Please rebuild the app with manifest.json version bumped to 1.3");
            return;
        }

        if (!isCameraActive) {
            haptic('click');
            label.innerText = "Starting Camera...";

            const ok = await window.outsync.camera.start({ torch: false });
            if (ok) {
                isCameraActive = true;
                img.src = "/camera/stream?" + Date.now();
                img.style.display = "block";
                overlay.style.display = "none";
            } else {
                label.innerText = "Start Failed (Check Logs)";
            }
        } else {
            haptic('click');
            await window.outsync.camera.stop();
            isCameraActive = false;
            img.src = "";
            img.style.display = "none";
            overlay.style.display = "flex";
            label.innerText = "Tap to Start";
        }
    }

    window.addEventListener('outsync_barcode', (e) => {
        haptic('success');
        sound('success');
        alert('Found Code: ' + e.detail);
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden && isCameraActive) {
            toggleCamera();
        }
    });
</script>
</body>
</html>
